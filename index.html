<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LightItUp</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111111;
            color: white;
            text-align: center;
        }

        .container {
            min-height: 100vh;
            padding: 70px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .logo {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .tagline {
            font-size: 20px;
            color: #cccccc;
            margin-bottom: 40px;
        }

        .create-button {
            background: #ffffff;
            color: #111111;
            border: none;
            padding: 16px 35px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .create-button:hover {
            transform: scale(1.05);
        }

        .links {
            margin-top: 50px;
            color: #aaaaaa;
        }

        .links span {
            margin: 0 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">🔥 LightItUp</div>

        <div class="tagline">
            Turn your ideas into amazing videos.
        </div>

        <button class="create-button" onclick="window.location.href='create.html'">
    + Create Video
</button>

        <div class="links">
            <span>My Videos</span>
            <span>Profile</span>
        </div>

    </div>

    <script>
        function createVideo() {
            alert("Welcome to LightItUp! Your video creator is coming soon.");
        }
    </script>

</body>
</html>
